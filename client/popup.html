<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SemanticEdge Status</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #202124;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dadce0;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #1a73e8;
      margin: 0;
    }
    .version {
      font-size: 11px;
      color: #70757a;
      background-color: #e8eaed;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-card {
      background-color: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
      text-align: left;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .status-item:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #5f6368;
    }
    .value {
      font-weight: 600;
    }
    .badge-active {
      color: #1aa251;
      background-color: #e6f4ea;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      text-transform: uppercase;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #70757a;
      text-align: center;
      border-top: 1px dashed #dadce0;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3 class="title">SemanticEdge</h3>
    <span class="version">v1.0 MVP</span>
  </div>
  
  <div class="status-card">
    <div class="status-item">
      <span class="label">Agente de Escucha:</span>
      <span class="value badge-active">Activo</span>
    </div>
    <div class="status-item">
      <span class="label">Análisis de URLs:</span>
      <span class="value" style="color: #1a73e8;">Tiempo Real</span>
    </div>
    <div class="status-item">
      <span class="label">Pipeline de IA:</span>
      <span class="value" style="color: #e67c73;">Híbrido (Dual)</span>
    </div>
  </div>
  
  <div class="footer">
    Cátedra Ciberseguridad · Universidad de Málaga & VirusTotal
  </div>
</body>
</html>
